<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-dark">
    <header>
      <nav
        class="navbar navbar-expand-lg navbar bg-dark border-bottom border-body"
        data-bs-theme="dark"
      >
        <div class="container-fluid">
          <a class="navbar-brand" href="#"
            ><img
              id="logo"
              src="./Netflix-assets/Netflix-assets/assets/netflix_logo.png"
          /></a>
        </div>
      </nav>
      <!-- fine navbar ---------------------------------------------------------------------------------------------->
    </header>
    <main class="me-5 ms-5 mb-5">
      <div class="row">
        <div class="col d-flex justify-content-center">
          <h1 class="text-white mt-5">Edit Profile</h1>
          <hr class="text-white" />
          <br />
        </div>
      </div>
      <div class="row d-flex justify-content-center">
        <div class="col d-flex justify-content-center flex-row">
          <img src="./Netflix-assets/Netflix-assets/assets/kids_icon.png" />
          <div class="d-flex flex-column">
            <input
              type="text"
              class="form-control form-control-sm ms-3 border border-white"
              style="width: 150px; height: 30px"
              placeholder="Strive Student"
            />
            <label class="text-white ms-3 mt-2">Language:</label>
            <button
              class="dropdown btn btn-secondary dropdown-toggle d-inline-block mt-1 ms-3 bg-dark rounded-0"
              type="button"
              style="width: 160px; height: 40px"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Select Language
            </button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">English</a></li>
              <li><a class="dropdown-item" href="#">Italiano</a></li>
              <li><a class="dropdown-item" href="#">Français</a></li>
            </ul>
          </div>
        </div>
      </div>
      <!-- fine primo blocco -------------------------------------------------------------------------------------------------->
      <div class="row">
        <div class="col flex-nowrap d-flex flex-row justify-content-center">
          <div
            class="col d-flex flex-column text-center text-sm-center text-md-center align-items-center"
          >
            <h6 class="text-white mt-3">Maturity settings:</h6>
            <hr class="text-white border-1 border-white" style="width: 400px" />
            <p
              class="border border-secondary bg-secondary text-white text-center"
              style="width: 180px; height: 30px"
            >
              ALL MATURITY RATINGS
            </p>
            <p class="text-white">
              Show titles of all maturity ratings for this profile.
            </p>
            <p class="text-white border border-white px-4 py-1">EDIT</p>
            <hr class="text-white border-1 border-white" style="width: 400px" />
            <p class="text-white">Autoplay controls</p>
            <div class="d-flex flex-row flex-wrap">
              <input class="form-check-input" type="checkbox" id="check1" />
              <label class="form-check-label text-white ms-2" for="check1">
                Autoplay next episodes in a series in all devices
              </label>
            </div>
            <div class="d-flex flex-row flex-wrap">
              <input class="form-check-input" type="checkbox" id="check1" />
              <label class="form-check-label text-white ms-2" for="check1">
                Autoplay previews while browsing on all devices
              </label>
            </div>
            <hr class="text-white border-1 border-white" style="width: 400px" />
            <div
              class="d-flex flex-row justify-content-center justify-content-sm-center justify-content-md-center mt-3"
            >
              <button
                type="button"
                class="btn btn-outline-dark bg-light text-black rounded-0 me-4"
              >
                SAVE
              </button>
              <button
                type="button"
                class="btn btn-outline-light rounded-0 me-4"
              >
                CANCEL
              </button>
              <button
                type="button"
                class="btn btn-outline-light rounded-0 me-4"
              >
                DELETE PROFILE
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
